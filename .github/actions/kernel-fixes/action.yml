name: Kernel Fixes
description: Apply only Android 12 / 5.10 host-tool build compatibility fixes
inputs:
  version:
    required: true
  android_version:
    required: true
  kernel_version:
    required: true
  sublevel:
    required: true
  os_patch_level:
    required: true
runs:
  using: composite
  steps:
  - name: Inherit host flags in resolve_btfids (WildKernel compatibility patch)
    shell: bash
    working-directory: ${{ github.workspace }}/kernel/common
    run: |
      set -euo pipefail
      [ "${{ inputs.version }}" = android12-5.10 ] || {
        echo "ERROR: unsupported kernel target." >&2
        exit 1
      }
      patch_file="${{ github.action_path }}/patches/resolve-btfids-host-flags.patch"
      if patch --dry-run --batch --forward --fuzz=0 -p1 < "$patch_file"; then
        patch --batch --forward --fuzz=0 --no-backup-if-mismatch -p1 < "$patch_file"
      elif patch --dry-run --batch --reverse --fuzz=0 -p1 < "$patch_file"; then
        echo "resolve_btfids host flags are already integrated upstream."
      else
        echo "ERROR: resolve_btfids compatibility patch needs updating." >&2
        exit 1
      fi
