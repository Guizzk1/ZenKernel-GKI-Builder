name: Setup build cache
description: Configure ccache and ThinLTO for Android 12 / 5.10
inputs:
  version:
    required: true
  kernel_version:
    required: true
  android_version:
    required: true
  sublevel:
    required: true
runs:
  using: composite
  steps:
    - name: Setup ccache
      shell: bash
      run: |
        set -euo pipefail
        [ "${{ inputs.version }}" = android12-5.10 ]
        if ! command -v ccache >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y ccache
        fi
        ccache --version
        mkdir -p /home/runner/.ccache
        {
          echo "CCACHE_DIR=/home/runner/.ccache"
          echo "CCACHE_MAXSIZE=8G"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_BASEDIR=${{ github.workspace }}"
          echo "CCACHE_NOHASHDIR=true"
          echo "CCACHE_COMPRESSION=true"
        } >> "$GITHUB_ENV"

    - name: Setup ThinLTO cache
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /home/runner/.ld_cache
        echo "LDCACHE_DIR=/home/runner/.ld_cache" >> "$GITHUB_ENV"
        printf '%s\n' \
          '#!/bin/bash' \
          'exec ld.lld "$@" --thinlto-cache-dir="$LDCACHE_DIR" --thinlto-cache-policy=cache_size_bytes=4g' \
          > "${{ github.workspace }}/kernel/common/ld-wrapper"
        chmod +x "${{ github.workspace }}/kernel/common/ld-wrapper"
